name: License headers

# Скрипт обходит только backend и frontend — на правку README или compose ему смотреть нечего.
on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/license-headers.sh"
      - ".github/workflows/license.yml"
  pull_request:
    branches: [master]
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/license-headers.sh"
      - ".github/workflows/license.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check SPDX headers
        run: bash scripts/license-headers.sh --check
