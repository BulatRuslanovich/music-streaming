name: music-streaming

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-32MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - temp_file_limit=${POSTGRES_TEMP_FILE_LIMIT:-4GB}
      - -c
      - max_wal_size=${POSTGRES_MAX_WAL_SIZE:-2GB}
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-1g}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-music}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-music}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-music} -d ${POSTGRES_DB:-music}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]

  storage-init:
    image: alpine:3
    user: root
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /storage/music /storage/covers
        chown ${PUID:-1000}:${PGID:-1000} /storage /storage/music /storage/covers
        echo "storage ready at $$(stat -c '%u:%g' /storage)"
    volumes:
      - ${MUSIC_STORAGE_PATH:-./storage}:/storage
    networks: [internal]

  # Модель CLAP — звуковая половина рекомендаций, и бэкенд без неё не поднимается. В git и в образ
  # бэкенда она не входит (~280 МБ), а собирает себя сама, как схема базы из db/init: на пустом
  # томе этот сервис выгружает её в <storage>/models/clap и выходит, на заполненном — выходит сразу.
  # Первый старт качает torch и чекпоинт с Hugging Face (около гигабайта) и занимает минуты.
  clap-model:
    build:
      context: ./backend/scripts
      dockerfile: Dockerfile.clap
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      storage-init:
        condition: service_completed_successfully
    volumes:
      - ${MUSIC_STORAGE_PATH:-./storage}:/storage
    networks: [internal]

  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/bulatruslanovich/music-streaming}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      clap-model:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-music};
        Username=${POSTGRES_USER:-music};Password=${POSTGRES_PASSWORD};
        Maximum Pool Size=${POSTGRES_MAX_POOL_SIZE:-40}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required (32+ bytes)}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-10}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS:-30}
      Storage__RootPath: /storage
      Storage__MaxUploadBytes: ${MAX_UPLOAD_BYTES:-209715200}
      Recommendations__Enabled: ${RECOMMENDATIONS_ENABLED:-true}
      AudioEmbedding__ModelSha256: ${AUDIO_EMBEDDING_MODEL_SHA256:-}
      AudioEmbedding__IntraOpThreads: ${AUDIO_EMBEDDING_INTRA_OP_THREADS:-0}
      Transcode__HlsSegmentSeconds: ${HLS_SEGMENT_SECONDS:-4}
      Transcode__Workers: ${TRANSCODE_WORKERS:-0}
      Transcode__BackfillEnabled: ${TRANSCODE_BACKFILL_ENABLED:-true}
      Transcode__BackfillBatchSize: ${TRANSCODE_BACKFILL_BATCH:-8}
      Transcode__BackfillPauseSeconds: ${TRANSCODE_BACKFILL_PAUSE_SECONDS:-5}
      LibraryEnrichment__Enabled: ${LIBRARY_ENRICHMENT_ENABLED:-true}
      AudioDb__ApiKey: ${AUDIODB_API_KEY:-2}
      AudioDb__RequestDelayMs: ${AUDIODB_REQUEST_DELAY_MS:-1000}
      Lrclib__RequestDelayMs: ${LRCLIB_REQUEST_DELAY_MS:-500}
      Owner__Username: ${OWNER_USERNAME:-admin}
      Owner__Password: ${OWNER_PASSWORD:?OWNER_PASSWORD is required on first start}
      Owner__ResetPasswordOnStartup: ${OWNER_RESET_PASSWORD:-false}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - ${MUSIC_STORAGE_PATH:-./storage}:/storage
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-2g}
    networks: [internal]

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/bulatruslanovich/music-streaming}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:8080
    deploy:
      resources:
        limits:
          memory: ${FRONTEND_MEMORY_LIMIT:-512m}
    networks: [internal]

  caddy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
    image: ${IMAGE_PREFIX:-ghcr.io/bulatruslanovich/music-streaming}/caddy:${IMAGE_TAG:-latest}
    pull_policy: build
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      MAX_UPLOAD_BODY_BYTES: ${MAX_UPLOAD_BODY_BYTES:-268435456}
      PUBLIC_DOMAIN: "${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required — Caddy issues its own certificate for that hostname}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
