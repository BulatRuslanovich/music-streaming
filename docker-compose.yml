name: music-streaming

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-music}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-music}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-music} -d ${POSTGRES_DB:-music}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]

  storage-init:
    image: alpine:3
    user: root
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /storage/music /storage/covers
        chown ${PUID:-1000}:${PGID:-1000} /storage /storage/music /storage/covers
        echo "storage ready at $$(stat -c '%u:%g' /storage)"
    volumes:
      - ${MUSIC_STORAGE_PATH:-./storage}:/storage
    networks: [internal]

  backend:
    build:
      context: ./backend
      # Хеш подхватывается из окружения команды, а не из .env: в .env он бы протух после первого же
      # коммита. См. «Build metadata» в README.
      args:
        GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-music};
        Username=${POSTGRES_USER:-music};Password=${POSTGRES_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required (32+ bytes)}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-10}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS:-30}
      Storage__RootPath: /storage
      Storage__MaxUploadBytes: ${MAX_UPLOAD_BYTES:-209715200}
      Playback__HistoryThresholdSeconds: ${HISTORY_THRESHOLD_SECONDS:-30}
      Transcode__Enabled: ${TRANSCODE_ENABLED:-true}
      Recommendations__Enabled: ${RECOMMENDATIONS_ENABLED:-true}
      Recommendations__ShelfSize: ${RECOMMENDATIONS_SHELF_SIZE:-12}
      Recommendations__ExplorationRatio: ${RECOMMENDATIONS_EXPLORATION_RATIO:-0.25}
      Recommendations__EventRetentionDays: ${RECOMMENDATIONS_EVENT_RETENTION_DAYS:-180}
      Transcode__LowBitrateKbps: ${TRANSCODE_LOW_KBPS:-64}
      Transcode__NormalBitrateKbps: ${TRANSCODE_NORMAL_KBPS:-128}
      Transcode__HighBitrateKbps: ${TRANSCODE_HIGH_KBPS:-192}
      Lastfm__ApiKey: ${LASTFM_API_KEY:-}
      Lastfm__ApiSecret: ${LASTFM_API_SECRET:-}
      Lastfm__PublicUrl: https://${PUBLIC_DOMAIN}
      Owner__Username: ${OWNER_USERNAME:-admin}
      Owner__Password: ${OWNER_PASSWORD:?OWNER_PASSWORD is required on first start}
      Owner__DisplayName: ${OWNER_DISPLAY_NAME:-}
      Owner__ResetPasswordOnStartup: ${OWNER_RESET_PASSWORD:-false}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - ${MUSIC_STORAGE_PATH:-./storage}:/storage
    networks: [internal]

  artist-images:
    profiles: [tools]
    build:
      context: ./backend
      target: tools
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Default: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-music};
        Username=${POSTGRES_USER:-music};Password=${POSTGRES_PASSWORD}
      Storage__RootPath: /storage
      AudioDb__ApiKey: ${AUDIODB_API_KEY:-2}
      AudioDb__RequestDelayMs: ${AUDIODB_REQUEST_DELAY_MS:-1000}
    volumes:
      - ${MUSIC_STORAGE_PATH:-./storage}:/storage
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      args:
        GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      MAX_UPLOAD_BODY_BYTES: ${MAX_UPLOAD_BODY_BYTES:-268435456}
      PUBLIC_DOMAIN: "${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required — Caddy issues its own certificate for that hostname}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [internal]

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki-config.yml
      - -config.expand-env=true
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-720h}
    volumes:
      - ./deploy/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks: [internal]

  promtail:
    image: grafana/promtail:3.3.2
    restart: unless-stopped
    depends_on:
      - loki
    command:
      - -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./deploy/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks: [internal]

  grafana:
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [internal]

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  internal:
    driver: bridge
