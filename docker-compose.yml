name: music-streaming

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-music}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-music}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-music} -d ${POSTGRES_DB:-music}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]

  storage-init:
    image: alpine:3
    user: root
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /storage/music /storage/covers
        chown ${PUID:-1000}:${PGID:-1000} /storage /storage/music /storage/covers
        echo "storage ready at $$(stat -c '%u:%g' /storage)"
    volumes:
      - ${MUSIC_STORAGE_PATH:-./storage}:/storage
    networks: [internal]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-music};
        Username=${POSTGRES_USER:-music};Password=${POSTGRES_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required (32+ bytes)}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-30}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS:-30}
      Storage__RootPath: /storage
      Storage__MaxUploadBytes: ${MAX_UPLOAD_BYTES:-31457280}
      Playback__HistoryThresholdSeconds: ${HISTORY_THRESHOLD_SECONDS:-30}
      Transcode__Enabled: ${TRANSCODE_ENABLED:-true}
      Recommendations__Enabled: ${RECOMMENDATIONS_ENABLED:-true}
      Recommendations__ShelfSize: ${RECOMMENDATIONS_SHELF_SIZE:-12}
      Recommendations__ExplorationRatio: ${RECOMMENDATIONS_EXPLORATION_RATIO:-0.25}
      Recommendations__EventRetentionDays: ${RECOMMENDATIONS_EVENT_RETENTION_DAYS:-180}
      Transcode__BitrateKbps: ${TRANSCODE_BITRATE_KBPS:-128}
      Owner__Username: ${OWNER_USERNAME:-admin}
      Owner__Password: ${OWNER_PASSWORD:?OWNER_PASSWORD is required on first start}
      Owner__DisplayName: ${OWNER_DISPLAY_NAME:-}
      Owner__ResetPasswordOnStartup: ${OWNER_RESET_PASSWORD:-false}
    volumes:
      - ${MUSIC_STORAGE_PATH:-./storage}:/storage
    networks: [internal]

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-31457280}
      PUBLIC_DOMAIN: "${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required — Caddy issues its own certificate for that hostname}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

  # ── Observability ────────────────────────────────────────────────────────────────────────
  # Neither service is reachable from the internet. Prometheus publishes no port at all and lives
  # only on the internal network; Grafana binds to loopback, so reaching it on a server means an
  # SSH tunnel:  ssh -L 3001:127.0.0.1:3001 your-host
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [internal]

  grafana:
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [internal]

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:

networks:
  internal:
    driver: bridge
