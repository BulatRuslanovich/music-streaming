name: Security

# Фильтры действуют только на push и pull_request; еженедельный прогон идёт всегда и целиком —
# уязвимости появляются в зависимостях и базовых образах сами, без коммитов в репозиторий.
on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/security.yml"
  pull_request:
    branches: [master]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  dependencies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: NuGet packages with known vulnerabilities
        working-directory: backend
        run: |
          dotnet restore MusicStreaming.slnx

          report=$(dotnet list MusicStreaming.slnx package --vulnerable --include-transitive)
          echo "$report"

          if echo "$report" | grep -qiE '\b(Critical|High)\b'; then
            echo "::error::a dependency has a known critical or high severity vulnerability"
            exit 1
          fi

      - name: npm packages with known vulnerabilities
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

  # Trivy смотрит на базовый образ и системные пакеты, а они меняются не от правок кода. На PR
  # эти же два образа уже собирает compose-смоук, так что здесь остаются master и расписание.
  images:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            target: runtime
          - name: frontend
            context: ./frontend
            target: ""

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the image locally
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: caimack-${{ matrix.name }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}

      - name: Scan it
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: caimack-${{ matrix.name }}:scan
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}
