name: Backend CI

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "db/**"
      - "global.json"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "backend/**"
      - "db/**"
      - "global.json"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore MusicStreaming.slnx

      - name: Check formatting (whitespace)
        run: dotnet format whitespace MusicStreaming.slnx --no-restore --verify-no-changes

      - name: Check formatting (style)
        run: dotnet format style MusicStreaming.slnx --no-restore --verify-no-changes

      - name: Build
        run: dotnet build MusicStreaming.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test --solution MusicStreaming.slnx --no-restore --configuration Release
