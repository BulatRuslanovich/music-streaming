
global:
  scrape_interval: 30s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: caimack-backend
    metrics_path: /metrics
    scrape_protocols: ["PrometheusText0.0.4"]
    static_configs:
      - targets: ["backend:8080"]
        labels:
          service: backend

  - job_name: caimack-host
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: host
