name: music-streaming

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # Дефолты postgres рассчитаны на то, чтобы завестись где угодно, а не на эту нагрузку.
    # Здесь связывающая настройка — work_mem: пересборка похожести делает хеш-агрегации и
    # сортировки по временным таблицам на миллионы строк, и на четырёх мегабайтах каждая из них
    # уходит на диск. temp_file_limit — страховка с другой стороны: он превращает запрос,
    # раздувшийся на кривых данных, в ошибку одного прохода вместо заполненного тома.
    # Форма именно такая: postgres разбирает «-c» и «имя=значение» как два отдельных аргумента.
    # Слитное «-c=имя=значение» он молча не принимает, и контейнер не поднимается вовсе.
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-32MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - temp_file_limit=${POSTGRES_TEMP_FILE_LIMIT:-4GB}
      - -c
      - max_wal_size=${POSTGRES_MAX_WAL_SIZE:-2GB}
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-1g}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-music}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-music}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Схема — отдельный модуль (db/README.md), приложение её не создаёт. postgres выполняет
      # эти скрипты один раз, на пустом каталоге данных: у уже созданной базы они не трогаются.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-music} -d ${POSTGRES_DB:-music}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]

  # Снимок базы под своим профилем: `docker compose --profile backup up -d`.
  #
  # Копировать том postgres-data на живой базе нельзя — получится не снимок, а файлы в
  # произвольных стадиях записи. pg_dump снимает согласованный дамп, не останавливая сервис.
  # Рекомендательную часть (профили вкуса, похожесть, эмбеддинги) можно пересчитать; аккаунты,
  # плейлисты, избранное и историю — нельзя, ради них это и нужно.
  #
  # Вместе с базой обязательно копировать <storage>/.dataprotection: там лежат ключи, которыми
  # зашифрованы session_key учёток Last.fm, и без них дамп восстановится без них.
  # Процедура восстановления — в docs/deployment.md; бэкап, который ни разу не восстанавливали,
  # бэкапом не является.
  backup:
    image: postgres:17-alpine
    profiles: [backup]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ${BACKUP_PATH:-./backups}:/backups
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        while true; do
          stamp=$$(date +%Y%m%d-%H%M)
          if pg_dump -h postgres -U "${POSTGRES_USER:-music}" -d "${POSTGRES_DB:-music}" \
               -Fc -f "/backups/music-$$stamp.dump.tmp"; then
            mv "/backups/music-$$stamp.dump.tmp" "/backups/music-$$stamp.dump"
            echo "backup written: music-$$stamp.dump"
            ls -t /backups/*.dump 2>/dev/null | tail -n +$$((${BACKUP_KEEP:-14} + 1)) | xargs -r rm -f
          else
            echo "backup FAILED at $$stamp" >&2
            rm -f "/backups/music-$$stamp.dump.tmp"
          fi
          sleep ${BACKUP_INTERVAL_SECONDS:-86400}
        done
    networks: [internal]

  storage-init:
    image: alpine:3
    user: root
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /storage/music /storage/covers
        chown ${PUID:-1000}:${PGID:-1000} /storage /storage/music /storage/covers
        echo "storage ready at $$(stat -c '%u:%g' /storage)"
    volumes:
      - ${MUSIC_STORAGE_PATH:-./storage}:/storage
    networks: [internal]

  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/bulatruslanovich/music-streaming}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Maximum Pool Size задан явно и ниже, чем max_connections у postgres (по умолчанию 100).
      # Главная страница открывает до шести контекстов параллельно, поиск — четыре, так что
      # без потолка десяток одновременных заходов упирается не в пул, а в отказ базы
      # «sorry, too many clients» — отказ куда неприятнее короткого ожидания в пуле.
      ConnectionStrings__Default: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-music};
        Username=${POSTGRES_USER:-music};Password=${POSTGRES_PASSWORD};
        Maximum Pool Size=${POSTGRES_MAX_POOL_SIZE:-40}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required (32+ bytes)}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-10}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS:-30}
      Storage__RootPath: /storage
      Storage__MaxUploadBytes: ${MAX_UPLOAD_BYTES:-209715200}
      Playback__HistoryThresholdSeconds: ${HISTORY_THRESHOLD_SECONDS:-30}
      Transcode__Enabled: ${TRANSCODE_ENABLED:-true}
      Recommendations__Enabled: ${RECOMMENDATIONS_ENABLED:-true}
      # Остальные параметры рекомендаций — веса ранжирования. Их подбирает make eval, а не
      # оператор: значение, интересное только алгоритму, живёт в коде, а не в .env.
      AudioEmbedding__Enabled: ${AUDIO_EMBEDDING_ENABLED:-true}
      AudioEmbedding__Provider: ${AUDIO_EMBEDDING_PROVIDER:-clap}
      AudioEmbedding__ModelPath: ${AUDIO_EMBEDDING_MODEL_PATH:-models/clap/audio.onnx}
      AudioEmbedding__MelFiltersPath: ${AUDIO_EMBEDDING_MEL_FILTERS_PATH:-models/clap/mel_filters_64x513.f32}
      AudioEmbedding__ModelSha256: ${AUDIO_EMBEDDING_MODEL_SHA256:-}
      AudioEmbedding__IntraOpThreads: ${AUDIO_EMBEDDING_INTRA_OP_THREADS:-0}
      Transcode__LowBitrateKbps: ${TRANSCODE_LOW_KBPS:-64}
      Transcode__NormalBitrateKbps: ${TRANSCODE_NORMAL_KBPS:-128}
      Transcode__HighBitrateKbps: ${TRANSCODE_HIGH_KBPS:-192}
      Transcode__HlsSegmentSeconds: ${HLS_SEGMENT_SECONDS:-4}
      Transcode__Workers: ${TRANSCODE_WORKERS:-0}
      Transcode__BackfillEnabled: ${TRANSCODE_BACKFILL_ENABLED:-true}
      Transcode__BackfillBatchSize: ${TRANSCODE_BACKFILL_BATCH:-8}
      Transcode__BackfillPauseSeconds: ${TRANSCODE_BACKFILL_PAUSE_SECONDS:-5}
      LibraryImport__Enabled: ${LIBRARY_IMPORT_ENABLED:-true}
      LibraryImport__Directory: ${LIBRARY_IMPORT_DIR:-import}
      LibraryImport__ScanIntervalSeconds: ${LIBRARY_IMPORT_SCAN_INTERVAL_SECONDS:-300}
      LibraryImport__BatchSize: ${LIBRARY_IMPORT_BATCH:-50}
      LibraryImport__MinimumAgeSeconds: ${LIBRARY_IMPORT_MIN_AGE_SECONDS:-15}
      LibraryImport__AfterImport: ${LIBRARY_IMPORT_AFTER:-Delete}
      Security__LoginAttemptsPerMinute: ${LOGIN_ATTEMPTS_PER_MINUTE:-10}
      Security__UploadsPerMinute: ${UPLOADS_PER_MINUTE:-60}
      Security__SearchesPerMinute: ${SEARCHES_PER_MINUTE:-120}
      Security__EventsPerMinute: ${EVENTS_PER_MINUTE:-120}
      Security__AccountLockoutAttempts: ${ACCOUNT_LOCKOUT_ATTEMPTS:-10}
      Security__AccountLockoutMinutes: ${ACCOUNT_LOCKOUT_MINUTES:-15}
      Lastfm__ApiKey: ${LASTFM_API_KEY:-}
      Lastfm__ApiSecret: ${LASTFM_API_SECRET:-}
      Lastfm__PublicUrl: https://${PUBLIC_DOMAIN}
      LibraryEnrichment__Enabled: ${LIBRARY_ENRICHMENT_ENABLED:-true}
      TagEnrichment__Enabled: ${TAG_ENRICHMENT_ENABLED:-true}
      TagEnrichment__RequestDelayMs: ${TAG_ENRICHMENT_REQUEST_DELAY_MS:-350}
      AudioDb__ApiKey: ${AUDIODB_API_KEY:-2}
      AudioDb__RequestDelayMs: ${AUDIODB_REQUEST_DELAY_MS:-1000}
      Lrclib__RequestDelayMs: ${LRCLIB_REQUEST_DELAY_MS:-500}
      Owner__Username: ${OWNER_USERNAME:-admin}
      Owner__Password: ${OWNER_PASSWORD:?OWNER_PASSWORD is required on first start}
      Owner__DisplayName: ${OWNER_DISPLAY_NAME:-}
      Owner__ResetPasswordOnStartup: ${OWNER_RESET_PASSWORD:-false}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - ${MUSIC_STORAGE_PATH:-./storage}:/storage
    # Без потолка фоновая работа выбирает жертву для OOM-killer сама, и ей вполне может
    # оказаться postgres. Держать надо в первую очередь индекс эмбеддингов: полсотни тысяч
    # треков это около сотни мегабайт, и столько же ещё раз в момент пересборки, пока живы
    # оба снимка. Поверх него — ONNX Runtime и ffmpeg.
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-2g}
    networks: [internal]

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/bulatruslanovich/music-streaming}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Адрес бэкенда изнутри сети. Без него серверная половина фронтенда (префетч страниц в
      # lib/server/prefetch.ts и обновление сессии в proxy.ts) уходит на localhost:5199 — то есть
      # внутрь собственного контейнера, где никто не слушает. Сбой там проглатывается намеренно,
      # поэтому проявлялся бы не ошибкой, а молча отключённым SSR: каждая страница догружалась бы
      # на клиенте ровно тем водопадом, ради устранения которого префетч и написан.
      BACKEND_INTERNAL_URL: http://backend:8080
    deploy:
      resources:
        limits:
          memory: ${FRONTEND_MEMORY_LIMIT:-512m}
    networks: [internal]

  caddy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
    image: ${IMAGE_PREFIX:-ghcr.io/bulatruslanovich/music-streaming}/caddy:${IMAGE_TAG:-latest}
    # Этот образ единственный в стеке, который не публикуется в GHCR (release.yml собирает только
    # backend и frontend), — он собирается здесь, из deploy/Dockerfile.caddy. Без явной политики
    # compose сначала идёт за ним в реестр и падает на «denied», не дойдя до сборки.
    pull_policy: build
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      # HTTP/3 идёт по QUIC поверх UDP. Caddy слушал его и раньше, но порт не публиковался,
      # поэтому снаружи h3 был недостижим — а на потерях мобильного канала выигрыш от него больше,
      # чем от всего остального в этом файле.
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      MAX_UPLOAD_BODY_BYTES: ${MAX_UPLOAD_BODY_BYTES:-268435456}
      PUBLIC_DOMAIN: "${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required — Caddy issues its own certificate for that hostname}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

  # Мониторинг целиком в профиле: `docker compose up -d` поднимает только приложение,
  # `docker compose --profile observability up -d` — приложение вместе с мониторингом.
  # Чтобы он включался всегда, достаточно COMPOSE_PROFILES=observability в .env.
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    profiles: [observability]
    depends_on:
      backend:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [internal]

  # Диск и память видит только хост — без этого алерты о кончающемся месте не на чем построить.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    profiles: [observability]
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|cgroup.*|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|procfs|pstore|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [internal]

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    profiles: [observability]
    command:
      - -config.file=/etc/loki/loki-config.yml
      - -config.expand-env=true
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-720h}
    volumes:
      - ./deploy/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks: [internal]

  promtail:
    image: grafana/promtail:3.3.2
    restart: unless-stopped
    profiles: [observability]
    depends_on:
      - loki
    command:
      - -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./deploy/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks: [internal]

  grafana:
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    profiles: [observability]
    depends_on:
      - prometheus
      - loki
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    # INFO: ${VAR:?...} проверяется до того, как compose отбирает сервисы по профилям, — с ним
    # обычный `up` спотыкался бы о пароль Grafana, которой в стеке нет. Поэтому пароль
    # обязателен там, где он и нужен: внутри контейнера, который без него не поднимется.
    entrypoint:
      - sh
      - -c
      - |
        if [ -z "$$GF_SECURITY_ADMIN_PASSWORD" ]; then
          echo "GRAFANA_PASSWORD is required by the observability profile" >&2
          exit 1
        fi
        exec /run.sh
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [internal]

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  internal:
    driver: bridge
