# Discovers containers straight from the Docker socket rather than tailing a fixed set of paths,
# so a new service picked up by the "music-streaming" compose project is scraped without editing
# this file. Scoped to that project's containers only via the compose.project label filter.
#
# Mounting the socket hands promtail the same access as the docker CLI on the host — there is no
# such thing as a "read-only" Docker socket. Acceptable here because promtail never leaves the
# internal network and the image is a well-known, unmodified upstream build.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["com.docker.compose.project=music-streaming"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_name"]
        target_label: container
        regex: "^/(.*)$"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
    pipeline_stages:
      # Serilog's console template is "[HH:mm:ss] LVL message" (see LoggingSetup.cs). Exception
      # stack traces print as bare continuation lines and simply won't match — they're still
      # shipped, just without a level label.
      - match:
          selector: '{service="backend"}'
          stages:
            - regex:
                expression: '^\[\d{2}:\d{2}:\d{2}\] (?P<level>[A-Z]{3}) '
            - template:
                source: level
                template: >-
                  {{ if eq .Value "INF" }}info
                  {{- else if eq .Value "WRN" }}warning
                  {{- else if eq .Value "ERR" }}error
                  {{- else if eq .Value "FTL" }}critical
                  {{- else if eq .Value "DBG" }}debug
                  {{- else if eq .Value "VRB" }}trace
                  {{- else }}{{ .Value }}{{ end }}
            - labels:
                level:
